name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Set version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project AniMenyu.xcodeproj -scheme AniMenyu -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Create DMG
        run: |
          mkdir dist
          cp -R "build/Build/Products/Release/AniMenyu.app" dist/
          # create-dmg is flaky on headless runners; retry a few times
          for i in 1 2 3; do
            create-dmg \
              --volname "AniMenyu" \
              --window-pos 200 120 \
              --window-size 540 360 \
              --icon-size 100 \
              --icon "AniMenyu.app" 140 160 \
              --hide-extension "AniMenyu.app" \
              --app-drop-link 400 160 \
              "AniMenyu-$VERSION.dmg" dist/ && break
          done
          test -f "AniMenyu-$VERSION.dmg"

      - name: Sign DMG
        run: codesign --force --sign "Developer ID Application" "AniMenyu-$VERSION.dmg"

      - name: Notarize and staple
        run: |
          xcrun notarytool submit "AniMenyu-$VERSION.dmg" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          xcrun stapler staple "AniMenyu-$VERSION.dmg"

      - name: Checksum DMG
        id: checksum
        run: echo "sha256=$(shasum -a 256 "AniMenyu-$VERSION.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: AniMenyu-*.dmg
          generate_release_notes: true

  bump-cask:
    name: Bump Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
      CASK: tap/Casks/animenyu.rb
    steps:
      - name: Check out tap
        uses: actions/checkout@v7
        with:
          repository: lodev09/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # A slower run for an older tag must not roll the cask back.
      - name: Check cask version
        id: check
        run: |
          CURRENT="$(sed -n -E 's/^  version "([^"]*)"$/\1/p' "$CASK")"
          if [ "$CURRENT" != "$VERSION" ] && printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V -C; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cask is at $CURRENT; skipping $VERSION"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update cask
        if: steps.check.outputs.bump == 'true'
        run: |
          sed -i -E \
            -e "s/^  version \"[^\"]*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \"[^\"]*\"$/  sha256 \"$SHA256\"/" \
            "$CASK"
          grep -q "^  version \"$VERSION\"$" "$CASK"
          grep -q "^  sha256 \"$SHA256\"$" "$CASK"

      - name: Push cask
        if: steps.check.outputs.bump == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "animenyu $VERSION"
          git push
